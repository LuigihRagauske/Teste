<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Cadastre seu Pet</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="app">

        <!-- ================= HEADER ================= -->
        <header class="header">

            <div class="header-top">

                <button class="back-button" id="backButton" type="button">
                    <span>‹</span>
                </button>

                <h1>CADASTRE SEU PET</h1>

                <div class="header-paw">
                    <span class="paw">●</span>
                    <span class="paw paw-left">●</span>
                    <span class="paw paw-right">●</span>
                    <span class="paw paw-bottom">●</span>
                </div>

            </div>

        </header>


        <!-- ================= CONTEÚDO ================= -->
        <section class="content">

            <form id="petForm" novalidate>

                <!-- NOME -->
                <div class="form-row">

    <div class="field-icon dog-icon">
        ♡
    </div>

    <div class="field-content">

        <label for="nome">NOME:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="off"
        >

    </div>

</div>



                <!-- ESPÉCIE -->
                <div class="form-row">

                    <div class="field-icon paw-icon">
                        ✣
                    </div>

                    <div class="field-content">

                        <label>ESPÉCIE:</label>

                        <div class="options">

                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="especie"
                                    value="cachorro"
                                >

                                <span class="custom-check"></span>

                                <span>CACHORRO</span>

                            </label>


                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="especie"
                                    value="gato"
                                >

                                <span class="custom-check"></span>

                                <span>GATO</span>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- RAÇA -->
                <div class="form-row">

                    <div class="field-icon">
                        ♢
                    </div>

                    <div class="field-content">

                        <label for="raca">RAÇA:</label>

                        <input
                            type="text"
                            id="raca"
                            name="raca"
                            autocomplete="off"
                        >

                    </div>

                </div>


                <!-- IDADE -->
                <div class="form-row">

                    <div class="field-icon">
                        ▣
                    </div>

                    <div class="field-content">

                        <label for="idade">IDADE:</label>

                        <input
                            type="number"
                            id="idade"
                            name="idade"
                            min="0"
                            max="100"
                        >

                    </div>

                </div>


                <!-- DESCRIÇÃO -->
                <div class="form-row">

                    <div class="field-icon">
                        ▢
                    </div>

                    <div class="field-content">

                        <label for="descricao">
                            DESCRIÇÃO DO ANIMAL:
                        </label>

                        <input
                            type="text"
                            id="descricao"
                            name="descricao"
                            autocomplete="off"
                        >

                    </div>

                </div>


                <!-- MICROCHIPADO -->
                <div class="form-row">

                    <div class="field-icon">
                        ▣
                    </div>

                    <div class="field-content">

                        <label>MICROCHIPADO:</label>

                        <div class="options">

                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="microchipado"
                                    value="sim"
                                >

                                <span class="custom-check"></span>

                                <span>SIM</span>

                            </label>


                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="microchipado"
                                    value="nao"
                                >

                                <span class="custom-check"></span>

                                <span>NÃO</span>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- CASTRADO -->
                <div class="form-row">

                    <div class="field-icon">
                        ♢
                    </div>

                    <div class="field-content">

                        <label>CASTRADO:</label>

                        <div class="options">

                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="castrado"
                                    value="sim"
                                >

                                <span class="custom-check"></span>

                                <span>SIM</span>

                            </label>


                            <label class="check-option">

                                <input
                                    type="radio"
                                    name="castrado"
                                    value="nao"
                                >

                                <span class="custom-check"></span>

                                <span>NÃO</span>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- FOTO -->
                <div class="form-row photo-row">

                    <div class="field-icon">
                        ▧
                    </div>

                    <div class="field-content">

                        <label>MÍDIA DO ANIMAL</label>

                        <div
                            class="upload-area"
                            id="uploadArea"
                        >

                            <input
                                type="file"
                                id="animalImage"
                                accept="image/*"
                                hidden
                            >

                            <div
                                class="upload-content"
                                id="uploadContent"
                            >

                                <div class="upload-icon">
                                    ⇧
                                </div>

                                <strong>
                                    Clique para enviar uma mídia
                                </strong>

                                <small>
                                    ou arraste e solte aqui
                                </small>

                            </div>

                            <img
                                id="imagePreview"
                                class="image-preview"
                                alt="Prévia da imagem"
                            >

                        </div>

                    </div>

                </div>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    Clique para cadastrar
                </button>

            </form>

        </section>


        <!-- ================= NAVEGAÇÃO ================= -->
        <nav class="bottom-nav">

            <button
                class="nav-item active"
                data-page="home"
                type="button"
            >
                <span class="nav-icon">⌂</span>
            </button>


            <button
                class="nav-item"
                data-page="pets"
                type="button"
            >
                <span class="nav-icon">♧</span>
            </button>


            <button
                class="nav-item main-nav"
                data-page="add"
                type="button"
            >

                <div class="pet-avatar">
                    🐶
                    <span>🐱</span>
                </div>

            </button>


            <button
                class="nav-item"
                data-page="messages"
                type="button"
            >
                <span class="nav-icon">➤</span>
            </button>


            <button
                class="nav-item"
                data-page="profile"
                type="button"
            >
                <span class="nav-icon">♙</span>
            </button>

        </nav>

    </main>


    <!-- ================= JAVASCRIPT ================= -->
    <script>

        /* ============================================
           ELEMENTOS
        ============================================ */

        

    </script>

</body>
</html>
