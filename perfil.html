<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #FF7A29;
    --orange-dark: #F26A15;
    --orange-light: #FFA35C;
    --gray-text: #8A8A8F;
    --gray-icon: #B9B9C0;
    --divider: #F0EEEC;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: #EDEDED;
    font-family: 'Nunito', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 24px 0;
  }

  .phone{
    width: 395px;
    max-width: 100vw;
    min-height: 879px;
    background: linear-gradient(180deg, #FFF4EA 0%, #FFEFE0 55%, #FFFFFF 55%);
    background-color:#FFFFFF;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    position: relative;
  }

  /* faint doodle background on the top peach area */
  .doodles{
    position:absolute;
    top:0; left:0; right:0;
    height: 300px;
    background-image:
      radial-gradient(circle at 12% 10%, rgba(255,150,60,0.10) 3px, transparent 3px),
      radial-gradient(circle at 85% 8%, rgba(255,150,60,0.10) 3px, transparent 3px),
      radial-gradient(circle at 90% 30%, rgba(255,150,60,0.10) 3px, transparent 3px),
      radial-gradient(circle at 8% 32%, rgba(255,150,60,0.10) 3px, transparent 3px);
    pointer-events:none;
  }

  .content{
    position:relative;
    padding: 26px 22px 90px;
  }

  /* ---------- TOP BAR ---------- */
  .top-bar{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-bottom: 18px;
  }

  .icon-circle{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fff;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .icon-circle svg{ width:18px; height:18px; color:#7a7a7a; }

  /* ---------- AVATAR ---------- */
  .avatar-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom: 10px;
  }

  .avatar-frame{
    position:relative;
    width: 124px;
    height: 124px;
    margin-bottom: 14px;
  }

  .avatar-circle{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#6b6b6f;
    border: 4px solid #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .avatar-circle svg{ width:56%; height:56%; color:#9c9c9f; }

  .avatar-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }

  .avatar-add-btn{
    position:absolute;
    bottom: 2px;
    right: 2px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--orange);
    border: 3px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 3px 8px rgba(255,122,41,0.4);
  }

  .avatar-add-btn svg{ width:15px; height:15px; }

  .username{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color:#2c2c2c;
    margin-bottom: 20px;
  }

  /* ---------- STATS ---------- */
  .stats{
    display:flex;
    background:#fff;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 16px 0;
    margin-bottom: 16px;
  }

  .stat{
    flex:1;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .stat + .stat{ border-left: 1px solid var(--divider); }

  .stat-number{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--orange);
  }

  .stat-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size: 12px;
    font-weight: 700;
    color: #555;
  }

  .stat-label svg{ width:13px; height:13px; color: var(--orange); }

  /* ---------- BIO CARD ---------- */
  .bio-card{
    background:#fff;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 18px 20px;
    margin-bottom: 18px;
  }

  .bio-line{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size: 13px;
    font-weight: 700;
    color: #3a3a3a;
    line-height: 1.6;
  }

  /* ---------- EDIT BUTTON ---------- */
  .edit-profile-btn{
    width:100%;
    background: linear-gradient(135deg, var(--orange-light), var(--orange-dark));
    color:#fff;
    border:none;
    border-radius: 30px;
    padding: 14px;
    font-family:'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    margin-bottom: 20px;
    box-shadow: 0 8px 18px rgba(255,122,41,0.3);
  }

  .edit-profile-btn svg{ width:15px; height:15px; }

  /* ---------- PAINEL DE EDIÇÃO DE PERFIL ---------- */
  .edit-overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.35);
    display:none;
    align-items:flex-end;
    z-index: 10;
  }

  .edit-overlay.open{ display:flex; }

  .edit-panel{
    background:#fff;
    width:100%;
    border-radius: 24px 24px 0 0;
    padding: 22px 22px 24px;
  }

  .edit-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 18px;
  }

  .edit-panel-header h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 20px;
    color:#1F1F1F;
  }

  .close-edit{
    background:#F3F1EF;
    border:none;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .close-edit svg{ width:14px; height:14px; }

  .edit-field{ margin-bottom: 16px; }

  .edit-field label{
    display:block;
    font-size: 12.5px;
    font-weight: 800;
    color: #4a4a4a;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 8px;
  }

  .edit-field input,
  .edit-field textarea{
    width:100%;
    border: 1.5px solid #E4E2DF;
    border-radius: 10px;
    padding: 11px 12px;
    font-family:'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color:#2c2c2c;
    outline:none;
    resize: vertical;
  }

  .edit-field input:focus,
  .edit-field textarea:focus{ border-color: var(--orange); }

  .edit-status{
    font-size: 12.5px;
    font-weight: 700;
    color: #4a4a4a;
    min-height: 16px;
    margin-bottom: 10px;
  }

  .edit-status.error{ color: #D64545; }
  .edit-status.success{ color: #2E9E4F; }

  .save-edit-btn{
    width:100%;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff;
    border:none;
    border-radius: 30px;
    padding: 13px 0;
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    cursor:pointer;
  }

  .save-edit-btn:disabled{ opacity:0.7; cursor:default; }

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;
    background:#fff;
    border-radius: 30px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 6px;
    margin-bottom: 18px;
  }

  .tab{
    flex:1;
    text-align:center;
    padding: 10px 0;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 800;
    color: var(--gray-text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  .tab.active{
    background: #FFF0E5;
    color: var(--orange-dark);
  }

  .tab-grid-icon{
    display:grid;
    grid-template-columns: repeat(2,5px);
    grid-template-rows: repeat(2,5px);
    gap:2px;
  }

  .tab-grid-icon span{ border-radius:1.5px; }
  .tab-grid-icon span:nth-child(1){ background: var(--orange); }
  .tab-grid-icon span:nth-child(2){ background: #FFC08A; }
  .tab-grid-icon span:nth-child(3){ background: #FFC08A; }
  .tab-grid-icon span:nth-child(4){ background: var(--orange); }

  /* ---------- POSTS GRID ---------- */
  .posts-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .post-tile{
    aspect-ratio: 1/1;
    border-radius: 10px;
    overflow:hidden;
    background:#f2f0ee;
  }

  .post-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .post-tile.add-tile{
    background:#fff;
    border: 2px dashed #E6C9AE;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .post-tile.add-tile svg{ width:26px; height:26px; color: var(--orange); }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height: 78px;
    background:#fff;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.06);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding: 0 8px;
    z-index: 3;
  }

  .nav-item{
    background:none;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--gray-icon);
    width: 40px;
    height: 40px;
  }

  .nav-item svg, .nav-item img{ width:24px; height:24px; object-fit: contain; }

  .nav-item.active{ color: var(--orange); }

  .nav-center{
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-light), var(--orange));
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top: -30px;
    box-shadow: 0 10px 20px rgba(255,122,41,0.4);
    border: 4px solid #fff;
    overflow:hidden;
  }

  .nav-center img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

</style>
</head>

    <div class="doodles"></div>

    <div class="content">

      <div class="top-bar">
        <button class="icon-circle" aria-label="Notificações"></button>

            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/>

    // ---- Foto de perfil: abre a galeria do dispositivo e mostra o preview ----
    const avatarInput = document.getElementById('avatarInput');

  <script>
    const publiInput = document.getElementById('publiInput');
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---- Carregar os dados reais de quem está logado ----
    const SUPABASE_URL = 'https://blpueqrzgqypkabjnvlu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_b3ObyBNc_RiI5yoq8klo-Q_aSfOYVAg';

    const usernameText = document.getElementById('usernameText');
    const bioCard = document.getElementById('bioCard');

    let supabaseClient = null;
    let currentUserId = null;
    let currentBio = '';
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      carregarPerfil();
    } catch(err){
      console.error('Não foi possível conectar ao Supabase:', err);
    }

    async function carregarPerfil(){
      const { data: sessionData } = await supabaseClient.auth.getSession();

      if(!sessionData.session){
        window.location.href = 'login.html';
        return;
      }

      const userId = sessionData.session.user.id;
      currentUserId = userId;

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('username, avatar_url, bio')
        .eq('id', userId)
        .single();

      if(error){
        console.error('Erro ao carregar perfil:', error.message);
        return;
      }

      // Username: usa o que está salvo, ou "@usuário" se por algum motivo estiver vazio
      usernameText.textContent = '@' + (profile.username || 'usuário');

      // Avatar: só troca se o usuário já tiver enviado uma foto
      if(profile.avatar_url){
        document.getElementById('avatarImg').src = profile.avatar_url;
        document.getElementById('avatarImg').style.display = 'block';
        document.getElementById('avatarDefaultIcon').style.display = 'none';
      }

      // Bio: mostra o texto real se existir; senão, mantém o aviso de "ainda vazia"
      currentBio = profile.bio || '';
      if(profile.bio && profile.bio.trim() !== ''){
        bioCard.innerHTML = '<p class="bio-line">' + profile.bio + '</p>';
      }
      // Se não tiver bio, o aviso padrão que já está no HTML continua aparecendo.
    }

    // ---- Painel de edição de perfil ----
    const editOverlay = document.getElementById('editOverlay');
    const editProfileBtn = document.getElementById('editProfileBtn');
    const closeEdit = document.getElementById('closeEdit');
    const editUsernameInput = document.getElementById('editUsernameInput');
    const editBioInput = document.getElementById('editBioInput');
    const editStatus = document.getElementById('editStatus');
    const saveEditBtn = document.getElementById('saveEditBtn');

    editProfileBtn.addEventListener('click', () => {
      // Preenche o painel com o que já está salvo agora
      editUsernameInput.value = usernameText.textContent.replace(/^@/, '');
      editBioInput.value = currentBio;
      editStatus.textContent = '';
      editStatus.className = 'edit-status';
      editOverlay.classList.add('open');
    });

    closeEdit.addEventListener('click', () => editOverlay.classList.remove('open'));
    editOverlay.addEventListener('click', (e) => {
      if(e.target === editOverlay) editOverlay.classList.remove('open');
    });

    saveEditBtn.addEventListener('click', async () => {
      const novoUsername = editUsernameInput.value.trim();
      const novaBio = editBioInput.value.trim();

      if(!novoUsername){
        editStatus.textContent = 'O username não pode ficar vazio.';
        editStatus.className = 'edit-status error';
        return;
      }

      saveEditBtn.disabled = true;
      editStatus.textContent = 'Salvando...';
      editStatus.className = 'edit-status';

      const { error } = await supabaseClient
        .from('profiles')
        .update({ username: novoUsername, bio: novaBio })
        .eq('id', currentUserId);

      saveEditBtn.disabled = false;

      if(error){
        editStatus.textContent = error.message;
        editStatus.className = 'edit-status error';
        return;
      }

      // Atualiza a tela na hora, sem precisar recarregar a página
      usernameText.textContent = '@' + novoUsername;
      currentBio = novaBio;
      if(novaBio){
        bioCard.innerHTML = '<p class="bio-line">' + novaBio + '</p>';
      } else {
        bioCard.innerHTML = '<p class="bio-line" id="bioEmptyState">Você ainda não escreveu uma bio. Toque em "Editar perfil" para adicionar uma.</p>';
      }

      editStatus.textContent = 'Perfil atualizado!';
      editStatus.className = 'edit-status success';
      setTimeout(() => editOverlay.classList.remove('open'), 700);
    });
  </script>

  <script>
    const avatarImg = document.getElementById('avatarImg');
    const avatarDefaultIcon = document.getElementById('avatarDefaultIcon');

    avatarInput.addEventListener('change', async () => {
      const file = avatarInput.files[0];
      if (!file) return;

      // Mostra a prévia local na hora, enquanto o envio acontece
      const localPreview = URL.createObjectURL(file);
      avatarImg.src = localPreview;
      avatarImg.style.display = 'block';
      avatarDefaultIcon.style.display = 'none';

      if(!supabaseClient || !currentUserId){
        console.error('Sem conexão com o Supabase ou usuário não identificado.');
        return;
      }

      // Cada usuário tem sua própria "pasta" dentro do bucket, nomeada com o próprio id
      const extensao = file.name.split('.').pop();
      const caminhoArquivo = `${currentUserId}/avatar.${extensao}`;
      console.log('Caminho usado no upload:', caminhoArquivo);
      console.log('ID do usuário no momento do upload:', currentUserId);

      const { error: uploadError } = await supabaseClient
        .storage
        .from('avatars')
        .upload(caminhoArquivo, file, { upsert: true });

      if(uploadError){
        console.error('Erro ao enviar avatar:', uploadError.message);
        alert('Não foi possível enviar a foto: ' + uploadError.message);
        return;
      }

      // Pega o link público da foto que acabou de subir
      const { data: urlData } = supabaseClient
        .storage
        .from('avatars')
        .getPublicUrl(caminhoArquivo);

      // Adiciona um "?t=" com a hora atual só pra evitar que o navegador
      // mostre uma versão antiga da imagem guardada em cache
      const urlComCacheBuster = urlData.publicUrl + '?t=' + Date.now();

      const { error: updateError } = await supabaseClient
        .from('profiles')
        .update({ avatar_url: urlData.publicUrl })
        .eq('id', currentUserId);

      if(updateError){
        console.error('Erro ao salvar avatar no perfil:', updateError.message);
        return;
      }

      avatarImg.src = urlComCacheBuster;
    });

    // ---- Publicações: abre a galeria e adiciona as fotos escolhidas na grade ----
    const postInput = document.getElementById('postInput');
    const addPostTile = document.getElementById('addPostTile');
    const postsGrid = document.getElementById('postsGrid');

    addPostTile.addEventListener('click', () => postInput.click());

    postInput.addEventListener('change', () => {
      const files = Array.from(postInput.files);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const tile = document.createElement('div');
          tile.className = 'post-tile';
          const img = document.createElement('img');
          img.src = e.target.result;
          tile.appendChild(img);
          postsGrid.insertBefore(tile, addPostTile);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>

</body>
